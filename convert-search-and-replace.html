<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert search and replace in JS</title>
</head>
<body>
    <h1>here we learn about Convert search and replace in JS</h1>
    <p id="number-result"></p>
    <p id="string-result"></p>
    <script>
        x=70;
        y=90;
        document.getElementById("number-result").innerHTML=x+y;
        document.getElementById("string-result").innerHTML= String(x)+String(y);
    </script>
</body>
</html>
